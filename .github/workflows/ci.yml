name: CI

# デプロイは Vercel が行う。ここでは lint・テスト・型チェック・ビルドが通るかだけを確認する。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同じブランチで新しく push されたら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json # engines.node を使う
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run

      - name: Type check & build
        run: npm run build
